[tools]
# Stack
node = "lts"
"npm:pnpm" = "latest"

# Tools
fnox = "latest"
shfmt = "latest"
jaq = "latest"

# Tasks ########################################################################

# Dev ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# dev
[tasks.dev]
run = "pnpm exec vite build --mode development --watch"

# Build ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# build
[tasks.build]
run = "./scripts/build.sh"

# Publish ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# publish
[tasks.publish]
run = "./scripts/publish.sh"

# Test ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# test
[tasks.test]
run = "pnpm exec vitest run"

# test:watch
[tasks."test:watch"]
run = "pnpm exec vitest"

# Types ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# types
[tasks.types]
run = "pnpm exec tsc"

# types:watch
[tasks."types:watch"]
run = "pnpm exec tsc --watch"

# Format ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# format
[tasks.format]
run = "pnpm exec oxfmt"

# format:check
[tasks."format:check"]
run = "pnpm exec oxfmt --check"

# Lint ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# lint
[tasks.lint]
run = "pnpm exec oxlint"
